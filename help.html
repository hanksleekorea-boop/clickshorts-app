<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도움말·계정 문의 · 클릭쇼츠</title><style>body{max-width:760px;margin:0 auto;padding:32px 18px;font:16px/1.75 system-ui;color:#27332d}a{color:#087f48}.notice{padding:14px;border:1px solid #e0b34b;background:#fff8e6;border-radius:10px}</style><main><p><a href="./">← 클릭쇼츠로 돌아가기</a></p><h1>도움말·계정 문의</h1><h2>Google 로그인</h2><p>현재 후보는 안전한 로그인 경계와 화면까지 준비되었습니다. 운영 인증 서버가 연결되지 않은 상태에서는 설정 오류를 정확히 표시합니다.</p><h2>백업</h2><p>내 계정에서 백업 파일 만들기를 직접 눌러야 파일이 생깁니다. 복원은 파일 검사, 미리보기, 별도 확인의 세 단계를 거칩니다.</p><h2>Google 계정 보안</h2><p>비밀번호, 2단계 인증, 로그인 기기는 <a href="https://myaccount.google.com/security">Google 계정 보안</a>에서 관리합니다.</p></main></html>
